buildscript {
    repositories {
        maven { url = 'https://repo.maven.apache.org/maven2/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:4.0.23'
    }
}
apply plugin: 'net.minecraftforge.gradle'

version = mod_version
group = 'newearth'
archivesBaseName = 'NewEarth'
sourceCompatibility = targetCompatibility = 1.8

repositories {
    maven { url = 'https://libraries.minecraft.net'; metadataSources { mavenPom(); artifact() } }
    mavenCentral()
    flatDir { dirs '../../dependencies/GalaxySpace/libs' }
}
minecraft { mappings channel: 'stable', version: '39-1.12' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    implementation fg.deobf('libs:Galacticraft-1.12.2:4.0.2.283')
    compileOnly files('../../dependencies/GalaxySpace/build/libs/GalaxySpace-1.12.2-dev.jar',
            '../../dependencies/GalaxySpace/libs/AsmodeusCore-1.12.2-1.0.4-dev.jar')
    testImplementation files('../../dependencies/GalaxySpace/build/libs/GalaxySpace-1.12.2-dev.jar',
            '../../dependencies/GalaxySpace/libs/AsmodeusCore-1.12.2-1.0.4-dev.jar')
    testRuntimeOnly files('../../dependencies/GalaxySpace/libs/RedstoneFlux-1.12-2.1.0.6-universal.jar',
            '../../dependencies/GalaxySpace/libs/industrialcraft-2-2.8.222-ex112-api.jar',
            '../../dependencies/GalaxySpace/libs/Mekanism-1.12.2-9.4.13.349-api.jar')
    compileOnly files('../../dependencies/GalaxySpace/libs/jei_1.12.2-4.13.1.220.jar')
}
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

def terrainClasses = file("$buildDir/classes/terrain")
def terrainSources = fileTree('dimension/terrain/src') { include '**/*.java' }
def modernJavaHome = System.getenv('NEWEARTH_JAVA_HOME')
tasks.register('compileTerrain', Exec) {
    inputs.files terrainSources, file('src/main/java/newearth/dimension/TerrainSampler.java')
    inputs.files sourceSets.main.compileClasspath
    outputs.dir terrainClasses
    doFirst {
        if (!modernJavaHome) throw new GradleException('Set NEWEARTH_JAVA_HOME to JDK 25')
        delete terrainClasses
        terrainClasses.mkdirs()
        def argumentFile = file("$buildDir/terrain-javac.args")
        def quote = { value -> '"' + value.toString().replace('\\', '/') + '"' }
        argumentFile.text = ['--release', '25', '-proc:none', '-encoding', 'UTF-8',
                '-classpath', quote(sourceSets.main.compileClasspath.asPath), '-d', quote(terrainClasses),
                quote(file('src/main/java/newearth/dimension/TerrainSampler.java'))]
                .plus(terrainSources.files.sort().collect { quote(it) }).join('\n')
        commandLine file("$modernJavaHome/bin/javac" + (System.getProperty('os.name').startsWith('Windows') ? '.exe' : '')),
                '@' + argumentFile.absolutePath
    }
}
tasks.register('terrainJar', Jar) {
    dependsOn 'compileTerrain'
    archiveFileName = 'newearth-terrain.jar'
    destinationDirectory = file("$buildDir/terrain")
    from(terrainClasses) { exclude 'newearth/dimension/**' }
    from 'dimension/terrain/resources'
}
tasks.register('terrainReferenceCheck', Exec) {
    dependsOn 'compileTerrain'
    workingDir = rootProject.file('../../build/checks/newearth/terrain')
    doFirst {
        workingDir.mkdirs()
        commandLine file("$modernJavaHome/bin/java" + (System.getProperty('os.name').startsWith('Windows') ? '.exe' : '')),
                '-Djava.awt.headless=true', '--class-path',
                files(terrainClasses, 'dimension/terrain/resources').asPath + File.pathSeparator + sourceSets.main.compileClasspath.asPath,
                file('dimension/terrain/test/newearth/terrain/TerrainReferenceCheck.java').absolutePath,
                file('dimension/terrain/test/reference-density.bin').absolutePath
    }
}
check.dependsOn 'terrainReferenceCheck'
processResources {
    dependsOn 'terrainJar'
    from(tasks.named('terrainJar')) { into 'META-INF' }
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand version: project.version }
}
jar {
    manifest { attributes 'Implementation-Version': project.version,
            'FMLCorePlugin': 'newearth.PlanetLoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true' }
    finalizedBy 'reobfJar'
}

// Compile the existing GS matcher as a test input rather than duplicate its behavior.
compileTestJava.source('../../dependencies/GalaxySpace/src/main/java/galaxyspace/systems/SolarSystem/planets/overworld/recipes/AssemblyRecipes.java')
tasks.register('progressionCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'newearth.ProgressionProbe'
    systemProperty 'newearth.epResources', rootProject.file('../../dependencies/ExtraPlanets/src/main/resources').absolutePath
    workingDir = rootProject.file('../../build/checks/newearth/progression')
    doFirst { workingDir.mkdirs() }
    systemProperty 'java.awt.headless', 'true'
}
check.dependsOn progressionCheck
tasks.register('solarSystemCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'newearth.SolarSystemProbe'
    systemProperty 'newearth.configRoot', rootProject.file('../../config').absolutePath
    systemProperty 'newearth.resourceRoot', sourceSets.main.output.resourcesDir.absolutePath
    workingDir = rootProject.file('../../build/checks/newearth/solar-system')
    doFirst { workingDir.mkdirs() }
    systemProperty 'java.awt.headless', 'true'
}
check.dependsOn solarSystemCheck

tasks.register('environmentCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'newearth.EnvironmentProbe'
    workingDir = rootProject.file('../../build/checks/newearth/environment')
    doFirst { workingDir.mkdirs() }
    systemProperty 'java.awt.headless', 'true'
}
check.dependsOn environmentCheck

tasks.register('landscapeCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    main = 'newearth.LandscapeProbe'
    workingDir = rootProject.file('../../build/checks/newearth/landscape')
    doFirst { workingDir.mkdirs() }
    systemProperty 'java.awt.headless', 'true'
    if (System.getenv('NEWEARTH_DH_JAR')) systemProperty 'newearth.dhJar', System.getenv('NEWEARTH_DH_JAR')
    doFirst {
        if (!modernJavaHome) throw new GradleException('Set NEWEARTH_JAVA_HOME to JDK 25')
        executable = file("$modernJavaHome/bin/java" + (System.getProperty('os.name').startsWith('Windows') ? '.exe' : '')).absolutePath
    }
}
check.dependsOn landscapeCheck
