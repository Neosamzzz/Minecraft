allprojects { p ->
    afterEvaluate {
        task sharedTeamProbe(type: JavaCompile, dependsOn: classes) {
            source = p.fileTree('tests/shared_team') { include '*.java' }
            classpath = p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
            destinationDir = p.file('build/shared-team-probe')
            sourceCompatibility = '1.8'
            targetCompatibility = '1.8'
            options.encoding = 'UTF-8'
            options.compilerArgs = ['-proc:none']
        }
        task runSharedTeamProbe(type: JavaExec, dependsOn: sharedTeamProbe) {
            classpath = p.files('build/shared-team-probe') + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
            main = 'com.feed_the_beast.ftbquests.util.SharedTeamProbe'
            systemProperty 'java.awt.headless', 'true'
        }
    }
}
